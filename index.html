<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>선생님께 질문하기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* 커스텀 스크롤바 (선택사항) */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif; }
    </style>
</head>
<body class="bg-[#edf2f8] min-h-screen flex items-center justify-center p-4">

    <!-- 메인 카드 컨테이너 -->
    <div class="bg-white rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] flex flex-col md:flex-row w-full max-w-[900px] overflow-hidden min-h-[550px]">
        
        <!-- 왼쪽 파란색 영역 -->
        <div class="bg-[#3070f0] text-white p-10 md:p-12 md:w-5/12 flex flex-col relative">
            <h1 class="text-3xl font-bold mb-4">선생님께 질문하기</h1>
            <p class="text-blue-100 text-sm leading-relaxed mb-12">
                수업 내용, 동아리 가입, 진로 상담 등 궁금한 점이 있다면 언제든 편하게 메시지를 남겨주세요.
            </p>

            <div class="space-y-6 mt-auto mb-16">
                <div class="flex items-center gap-4 text-sm font-medium">
                    <div class="w-10 h-10 rounded-full bg-blue-500/50 flex items-center justify-center shrink-0">
                        <i data-lucide="map-pin" class="w-5 h-5 text-white"></i>
                    </div>
                    <span>오션중학교 정보 컴퓨터실</span>
                </div>
                <div class="flex items-center gap-4 text-sm font-medium">
                    <div class="w-10 h-10 rounded-full bg-blue-500/50 flex items-center justify-center shrink-0">
                        <i data-lucide="clock" class="w-5 h-5 text-white"></i>
                    </div>
                    <span>쉬는시간, 점심시간 방문 환영</span>
                </div>
            </div>

            <!-- 하단 로고 (Python, HTML5) -->
            <div class="flex gap-4 absolute bottom-10 left-10 opacity-50">
                <!-- Python Logo SVG -->
                <svg viewBox="0 0 118 118" width="28" height="28" fill="currentColor">
                    <path d="M58.8 3.5c-27.5 0-26 11.9-26 11.9l.1 12.3h26.7v3.8H20.6s-17.7-2-17.7 25.5c0 27.5 15.4 25.1 15.4 25.1h8.8v-12.7s-.2-14.7 14.5-14.7h27.4s13.4.2 13.4-13.1V16.3s1.2-12.8-23.6-12.8zm-13.8 8.8c2.6 0 4.7 2.1 4.7 4.7 0 2.6-2.1 4.7-4.7 4.7-2.6 0-4.7-2.1-4.7-4.7.1-2.6 2.2-4.7 4.7-4.7zm49.1 27.7c0 0-15.4.1-15.4 14.7H93.1s17.7 1.8 17.7-25.5c0-27.5-15.4-25.1-15.4-25.1h-8.8v12.7s.2 14.7-14.5 14.7H44.6s-13.4-.2-13.4 13.1v25.2s-1.2 12.8 23.6 12.8c27.5 0 26-11.9 26-11.9l-.1-12.3H54.1v-3.8h39s17.7 2.1 17.7-25.5-15.4-25.2-15.4-25.2h-1.3zm-20.9 59.8c2.6 0 4.7 2.1 4.7 4.7 0 2.6-2.1 4.7-4.7 4.7-2.6 0-4.7-2.1-4.7-4.7 0-2.6 2.1-4.7 4.7-4.7z"/>
                </svg>
                <!-- HTML5 Logo SVG -->
                <svg viewBox="0 0 512 512" width="28" height="28" fill="currentColor">
                    <path d="M108.4 0h295.1l-25.6 288L256 362.7 134.1 288l-25.7-288zM349 101.4H197.8l-4.8-51.4h161l-5 51.4zm-147 51.3h142.1l-4.7 51.4H206.8l-4.8-51.4zm-4.7 51.4h132.6l-8.9 99.4-65.2 21-65.3-21-4.4-48h51.4l1.9 19.3 16.4 5.3 16.4-5.3 3.6-38.6H192.6l4.7 51.3z"/>
                </svg>
            </div>
        </div>

        <!-- 오른쪽 폼 영역 -->
        <div class="p-10 md:p-12 md:w-7/12 flex flex-col justify-center">
            <form id="inquiryForm" class="space-y-6">
                
                <div class="flex flex-col md:flex-row gap-6">
                    <!-- 학년 반 -->
                    <div class="flex-1">
                        <label for="grade" class="block text-sm font-medium text-gray-700 mb-2">학년 반</label>
                        <input type="text" id="grade" name="grade" required
                            class="w-full bg-[#f8fafc] border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#3070f0] focus:border-transparent transition-all placeholder:text-gray-400"
                            placeholder="예: 1학년 2반">
                    </div>
                    <!-- 이름 -->
                    <div class="flex-1">
                        <label for="name" class="block text-sm font-medium text-gray-700 mb-2">이름</label>
                        <input type="text" id="name" name="name" required
                            class="w-full bg-[#f8fafc] border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#3070f0] focus:border-transparent transition-all placeholder:text-gray-400"
                            placeholder="홍길동">
                    </div>
                </div>

                <!-- 문의 구분 -->
                <div>
                    <label for="category" class="block text-sm font-medium text-gray-700 mb-2">문의 구분</label>
                    <div class="relative">
                        <select id="category" name="category" required
                            class="w-full bg-[#f8fafc] border border-gray-200 rounded-xl px-4 py-3 text-sm appearance-none focus:outline-none focus:ring-2 focus:ring-[#3070f0] focus:border-transparent transition-all">
                            <option value="기타 상담" selected>기타 상담</option>
                            <option value="수업 내용 질문">수업 내용 질문</option>
                            <option value="동아리 가입 문의">동아리 가입 문의</option>
                            <option value="진로 상담">진로 상담</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">
                            <i data-lucide="chevron-down" class="w-4 h-4"></i>
                        </div>
                    </div>
                </div>

                <!-- 내용 -->
                <div>
                    <label for="content" class="block text-sm font-medium text-gray-700 mb-2">내용</label>
                    <textarea id="content" name="content" required rows="5"
                        class="w-full bg-[#f8fafc] border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#3070f0] focus:border-transparent transition-all placeholder:text-gray-400 resize-none"
                        placeholder="궁금한 내용을 자유롭게 적어주세요."></textarea>
                </div>

                <!-- 알림 메시지 영역 (숨김 처리됨) -->
                <div id="toastMessage" class="hidden rounded-lg p-4 text-sm font-medium text-center transition-all"></div>

                <!-- 제출 버튼 -->
                <button type="submit" id="submitBtn"
                    class="w-full bg-[#0f172a] hover:bg-[#1e293b] text-white font-medium rounded-xl px-4 py-4 text-sm transition-colors flex items-center justify-center gap-2">
                    <span>메시지 보내기</span>
                </button>

            </form>
        </div>
    </div>

    <script>
        // Lucide 아이콘 초기화
        lucide.createIcons();

        // 폼 제출 로직
        const form = document.getElementById('inquiryForm');
        const submitBtn = document.getElementById('submitBtn');
        const toastMessage = document.getElementById('toastMessage');

        // ★ 중요: 구글 앱스 스크립트 배포 후 생성된 웹 앱 URL을 아래에 붙여넣으세요.
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxRliFupUN_6msakn_f6tcO7d27izxe44VTmVdvLL-eLUU4oJoV5OE7ZdmZCq8fsZKQ/exec';

        form.addEventListener('submit', e => {
            e.preventDefault();

            // SCRIPT_URL이 기본값인 경우 안내
            if(SCRIPT_URL === 'https://script.google.com/macros/s/AKfycbxRliFupUN_6msakn_f6tcO7d27izxe44VTmVdvLL-eLUU4oJoV5OE7ZdmZCq8fsZKQ/exec') {
                showToast('구글 앱스 스크립트 URL을 코드에 입력해주세요!', 'error');
                return;
            }

            // 버튼 상태 변경 (로딩)
            const originalBtnHtml = submitBtn.innerHTML;
            submitBtn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> 전송 중...`;
            lucide.createIcons();
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-70', 'cursor-not-allowed');
            toastMessage.classList.add('hidden');

            // 폼 데이터 수집
            const formData = new FormData(form);

            // 구글 스크립트로 전송
            fetch(SCRIPT_URL, { method: 'POST', body: formData })
                .then(response => {
                    showToast('메시지가 성공적으로 전송되었습니다.', 'success');
                    form.reset(); // 폼 초기화
                })
                .catch(error => {
                    console.error('Error!', error.message);
                    showToast('전송 중 오류가 발생했습니다. 다시 시도해주세요.', 'error');
                })
                .finally(() => {
                    // 버튼 상태 복구
                    submitBtn.innerHTML = originalBtnHtml;
                    submitBtn.disabled = false;
                    submitBtn.classList.remove('opacity-70', 'cursor-not-allowed');
                });
        });

        // 토스트 메시지 표시 함수
        function showToast(message, type) {
            toastMessage.textContent = message;
            toastMessage.classList.remove('hidden', 'bg-green-100', 'text-green-800', 'bg-red-100', 'text-red-800');
            
            if (type === 'success') {
                toastMessage.classList.add('bg-green-100', 'text-green-800');
            } else {
                toastMessage.classList.add('bg-red-100', 'text-red-800');
            }
        }
    </script>
</body>
</html>
